<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Claire Jiang — an engineering portfolio told as a medieval chronicle. Quests, an armory of skills, and a raven to send." />
  <meta name="theme-color" content="#efe3c8" />
  <meta property="og:title" content="Claire Jiang — The Chronicle of an Engineer" />
  <meta property="og:description" content="A medieval chronicle of engineering quests — hardware, software and the craft between them." />
  <meta property="og:type" content="website" />
  <title>Claire Jiang — The Chronicle of an Engineer</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Self-hosted fonts: works offline and behind restrictive networks -->
  <link rel="preload" href="assets/fonts/cinzel-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/eb-garamond-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>

  <noscript>
    <div class="noscript">
      This chronicle is rendered with JavaScript — please enable it.<br />
      这部编年史需要 JavaScript 渲染，请启用 JavaScript。
    </div>

  <!-- ============ ornament sprite ============ -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-sword" viewBox="0 0 24 24">
      <path d="M12 2.6 14.1 5.2 14.1 12.4 12 15 9.9 12.4 9.9 5.2Z" />
      <path d="M6.3 13.2h11.4" />
      <path d="M12 15v4.6" />
      <circle cx="12" cy="20.6" r="1.2" />
    </symbol>
    <symbol id="i-anvil" viewBox="0 0 24 24">
      <path d="M3.5 8.5h8.7c2 0 3.5-.8 4.7-2.2l1.4 1.2-1.3 2.3h-3.4l-1.1 3h-5l-1 3.2H4.3l1-3.2H3.5Z" />
      <path d="M8.8 15.8h4.3l-.5 3.2H9.3Z" />
      <path d="M5.5 19h13" />
    </symbol>
    <symbol id="i-quill" viewBox="0 0 24 24">
      <path d="M20.5 3.5c-8 0-14 4.5-15 12L4 19.5l4-1c7.5-1 12.5-6 12.5-15Z" />
      <path d="M7.5 16.5 17 7" />
    </symbol>
    <symbol id="i-compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path d="M15.6 8.4 13.4 13.4 8.4 15.6 10.6 10.6Z" />
    </symbol>
    <symbol id="i-tower" viewBox="0 0 24 24">
      <path d="M6 21V8h3V4.5h2V8h2V4.5h2V8h3v13Z" />
      <path d="M6 11.5h12" />
      <path d="M10 21v-5h4v5" />
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M7 17 17 7" />
      <path d="M8 7h9v9" />
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24">
      <path d="M12 19V5" />
      <path d="M6 11l6-6 6 6" />
    </symbol>
  </svg>

  <!-- ============ background layers ============ -->
  <div class="bg-wash" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <div class="page-frame" aria-hidden="true">
    <i class="pf-corner tl"></i><i class="pf-corner tr"></i>
    <i class="pf-corner bl"></i><i class="pf-corner br"></i>
  </div>

  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <!-- ============ seal overlay ============ -->
  <div class="seal-overlay" id="seal-overlay" aria-hidden="true">
    <div class="seal-inner">
      <div class="seal-ring">
        <span class="wax wax-large"><span class="wax-face" id="seal-face">CJ</span></span>
      </div>
      <p class="seal-title" id="seal-title">THE CHRONICLE</p>
      <p class="seal-sub" id="seal-sub">OF AN ENGINEER-ERRANT</p>
      <p class="seal-hint" id="seal-hint">CLICK TO BREAK THE SEAL</p>
    </div>
  </div>

  <!-- ============ top bar ============ -->
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Home">
      <svg class="brand-crest" viewBox="0 0 34 40" aria-hidden="true">
        <path d="M2 3h30v16c0 10-6.6 15.6-15 18.6C8.6 34.6 2 29 2 19Z" />
        <path d="M17 9v13M11 13l6-4 6 4M9 17h16" />
      </svg>
      <span class="brand-text">
        <span class="brand-name" id="brand-name">CLAIRE JIANG</span>
        <span class="brand-sub">ENGINEER-ERRANT</span>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Primary"></nav>

    <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">中文</button>
  </header>

  <main id="top">

    <!-- ======================= prologue ======================= -->
    <section class="hero" id="prologue">
      <div class="hero-rose" aria-hidden="true">
        <svg viewBox="0 0 400 400">
          <circle cx="200" cy="200" r="194" />
          <circle cx="200" cy="200" r="168" stroke-dasharray="1 6" />
          <circle cx="200" cy="200" r="128" />
          <path class="rose-star" d="M200 14 208 188 386 200 208 212 200 386 192 212 14 200 192 188Z" />
          <path class="rose-star" d="M200 66 206 192 330 200 206 208 200 334 194 208 70 200 194 192Z" />
          <g class="rose-ticks">
            <path d="M200 6v14M200 380v14M6 200h14M380 200h14" />
            <path d="M62 62l10 10M328 328l10 10M338 62l-10 10M72 328l-10 10" />
          </g>
          <g class="rose-letters">
            <text x="200" y="42">N</text>
            <text x="362" y="204">E</text>
            <text x="200" y="368">S</text>
            <text x="38" y="204">W</text>
          </g>
        </svg>
      </div>

      <div class="hero-grid">
        <div class="hero-copy">
          <p class="hero-pre" id="hero-pre"></p>
          <h1 class="hero-name" id="hero-name">Claire Jiang</h1>
          <p class="hero-role" id="hero-role"></p>
          <p class="hero-tagline" id="hero-tagline"><span class="type"></span><span class="nib" aria-hidden="true"></span></p>
          <p class="hero-status" id="hero-status"></p>
          <div class="hero-actions" id="hero-actions"></div>
        </div>

        <figure class="hero-crest">
          <svg class="crest" viewBox="0 0 420 540" role="img" aria-label="A heraldic shield bearing a sword, a gear and the motto Ferro et Igni">
            <defs>
              <linearGradient id="gGold" x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0" stop-color="#ecd49a" />
                <stop offset="0.45" stop-color="#c2a05c" />
                <stop offset="1" stop-color="#8a6a2e" />
              </linearGradient>
              <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0.2">
                <stop offset="0" stop-color="#f2ece0" />
                <stop offset="0.4" stop-color="#c9c3b4" />
                <stop offset="0.62" stop-color="#a8a294" />
                <stop offset="1" stop-color="#6f6a5e" />
              </linearGradient>
              <linearGradient id="gField" x1="0" y1="0" x2="0.55" y2="1">
                <stop offset="0" stop-color="#33271b" />
                <stop offset="0.55" stop-color="#241c14" />
                <stop offset="1" stop-color="#17110c" />
              </linearGradient>
              <clipPath id="shieldClip">
                <path d="M60 64 H360 V244 C360 340 292 412 210 458 C128 412 60 340 60 244 Z" />
              </clipPath>
            </defs>

            <!-- compass halo -->
            <g class="crest-halo" fill="none" stroke="currentColor">
              <circle cx="210" cy="252" r="202" stroke-opacity="0.22" />
              <circle cx="210" cy="252" r="176" stroke-opacity="0.14" stroke-dasharray="1 7" />
              <path d="M210 34v16M210 454v16M8 252h16M396 252h16" stroke-opacity="0.3" />
              <path d="M70 112l11 11M339 381l11 11M350 112l-11 11M81 381l-11 11" stroke-opacity="0.2" />
            </g>

            <!-- shield -->
            <path d="M60 64 H360 V244 C360 340 292 412 210 458 C128 412 60 340 60 244 Z"
                  fill="#0d0906" opacity="0.28" transform="translate(0 10)" />
            <path d="M60 64 H360 V244 C360 340 292 412 210 458 C128 412 60 340 60 244 Z"
                  fill="url(#gField)" stroke="url(#gGold)" stroke-width="3" />

            <g clip-path="url(#shieldClip)">
              <!-- faint heraldic rays -->
              <g stroke="#e3c783" stroke-opacity="0.05">
                <path d="M210 250 0 0M210 250 420 0M210 250 0 540M210 250 420 540" />
                <circle cx="210" cy="250" r="96" fill="none" stroke-opacity="0.08" />
                <circle cx="210" cy="250" r="150" fill="none" stroke-opacity="0.05" />
              </g>
              <!-- diamonds in the field -->
              <g fill="url(#gGold)" opacity="0.55">
                <path d="M104 196l7 7-7 7-7-7Z" />
                <path d="M316 196l7 7-7 7-7-7Z" />
                <path d="M104 320l7 7-7 7-7-7Z" />
                <path d="M316 320l7 7-7 7-7-7Z" />
              </g>
            </g>

            <!-- inner rule -->
            <path d="M74 78 H346 V244 C346 330 288 398 210 440 C132 398 74 330 74 244 Z"
                  fill="none" stroke="url(#gGold)" stroke-width="1.2" stroke-opacity="0.5" />

            <!-- sword: point down -->
            <g class="crest-sword">
              <path d="M210 152 220 172 216 382 210 422 204 382 200 172 Z" fill="url(#gSteel)" />
              <path d="M210 168v236" stroke="#fff" stroke-opacity="0.45" stroke-width="1.4" />
              <path d="M206 168v240" stroke="#4b463c" stroke-opacity="0.35" stroke-width="1" />
              <path d="M156 144 H264 V154 H156 Z" fill="url(#gGold)" />
              <path d="M156 144c-8 0-13 4-13 9M264 144c8 0 13 4 13 9" fill="none" stroke="url(#gGold)" stroke-width="3" />
              <rect x="202.5" y="100" width="15" height="44" rx="4" fill="#4a3021" />
              <g stroke="url(#gGold)" stroke-width="2">
                <path d="M202.5 112h15M202.5 124h15M202.5 136h15" />
              </g>
              <!-- gear pommel -->
              <g transform="translate(210 88)" fill="none" stroke="url(#gGold)" stroke-width="2.6">
                <circle r="12" />
                <path d="M0 -19V-12M0 12V19M-19 0h7M12 0h7M-13.4 -13.4l4.9 4.9M8.5 8.5l4.9 4.9M-13.4 13.4l4.9-4.9M8.5 -8.5l4.9-4.9" />
              </g>
              <circle cx="210" cy="88" r="3.6" fill="#8a2f28" />
            </g>

            <!-- banner -->
            <g class="crest-banner">
              <path d="M96 438 H324 V486 L210 502 96 486 Z" fill="#6f2a26" stroke="url(#gGold)" stroke-width="2" />
              <path d="M110 448 H310" stroke="#ecd49a" stroke-opacity="0.35" />
              <text x="210" y="474" class="crest-motto">FERRO ET IGNI</text>
            </g>

            <!-- cresting star -->
            <g fill="url(#gGold)">
              <path d="M210 26l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z" />
            </g>
          </svg>
          <figcaption class="crest-caption">
            <span class="crest-caption-latin">FERRO ET IGNI</span>
            <span class="crest-caption-zh">以铁与火</span>
          </figcaption>
        </figure>
      </div>

      <div class="hero-foot">
        <span class="folio" id="folio"></span>
        <a class="scroll-cue" id="scroll-cue" href="#chronicle"></a>
      </div>
    </section>

    <!-- ======================= ticker ======================= -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <!-- ======================= chronicle ======================= -->
    <section class="section" id="chronicle" data-numeral="I">
      <div class="section-head" data-heading="chronicle">
        <span class="h-roman"></span>
        <h2 class="h-main"></h2>
        <span class="h-sub"></span>
        <span class="h-rule"></span>
      </div>
      <p class="section-lede" data-lede="chronicle"></p>
      <div class="about-grid">
        <div class="about-bio" id="about-bio"></div>

    <!-- ======================= armory ======================= -->

        <span class="h-sub"></span>
        <span class="h-rule"></span>
      </div>
      <p class="section-lede" data-lede="armory"></p>
      <div class="skills" id="skills-grid"></div>
    </section>

    <!-- ======================= quests ======================= -->
    <section class="section" id="quests" data-numeral="III">
      <div class="section-head" data-heading="quests">
        <span class="h-roman"></span>
        <h2 class="h-main"></h2>
        <span class="h-sub"></span>
        <span class="h-rule"></span>
      </div>
      <p class="section-lede" data-lede="quests"></p>
      <div class="projects" id="projects-grid"></div>
    </section>

    <!-- ======================= saga ======================= -->
    <section class="section" id="saga" data-numeral="IV">
      <div class="section-head" data-heading="saga">
        <span class="h-roman"></span>
        <h2 class="h-main"></h2>
        <span class="h-sub"></span>
        <span class="h-rule"></span>
      </div>
      <p class="section-lede" data-lede="saga"></p>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- ======================= raven ======================= -->
    <section class="section" id="raven" data-numeral="V">
      <div class="section-head" data-heading="raven">
        <span class="h-roman"></span>
        <h2 class="h-main"></h2>
        <span class="h-sub"></span>
        <span class="h-rule"></span>
      </div>
      <p class="section-lede" data-lede="raven"></p>
      <div id="contact-box"></div>
    </section>

    <div class="finis" aria-hidden="true">
      <span class="finis-line"></span>
      <span class="finis-mark">✦</span>
      <span class="finis-line"></span>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-top">
      <span class="f-brand" id="f-brand"></span>
      <span class="f-motto" id="f-motto"></span>
    </div>
    <div class="footer-bottom">
      <span class="f-status" id="f-status"></span>
      <span class="f-made" id="f-made"></span>
      <span class="f-copy" id="f-copy"></span>

  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">
    <svg class="ico" aria-hidden="true"><use href="#i-up"></use></svg>
  </button>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
